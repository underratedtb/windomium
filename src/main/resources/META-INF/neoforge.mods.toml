Windomium is a modular, open-source optimisation engine and companion performance framework for Minecraft (NeoForge 1.21.1).

Key Features:
- Multi-Point Ray-Marched Occlusion & Frustum Culling
- Smart Interior Leaf Face Culling & Unfocused Background FPS Limiter
- Entity Shadow, Equipment Layer & NameTag Distance Culling
- Block Entity Nanosecond Frame-Budget Rate Limiter
- Self-Healing Thread-Safe Circuit Breaker & Adaptive Runtime Governor
- Built-in Compatibility Profiles for Create, Valkyrien Skies, Mekanism, AE2, Botania & Sodium/Iris
'''

